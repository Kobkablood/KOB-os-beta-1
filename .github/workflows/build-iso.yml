name: Build KOBos ISO

# Запуск вручную: вкладка Actions -> "Build KOBos ISO" -> Run workflow
on:
  workflow_dispatch:

permissions:
  contents: write   # нужно, чтобы выложить ISO в Releases

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 330

    steps:
      - uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc \
                      /opt/hostedtoolcache/CodeQL /usr/local/share/boost \
                      /usr/local/lib/node_modules /usr/share/swift
          sudo docker image prune --all --force || true
          sudo apt-get clean
          df -h /

      - name: Patch kobos-build.sh for modern live-build (Debian 13)
        run: |
          test -f kobos-build.sh || { echo "kobos-build.sh не найден в корне репозитория"; exit 1; }
          # убираем устаревшие опции (адрес "none", старые security-зеркала)
          sed -i \
            -e '/--parent-mirror-chroot-volatile none/d' \
            -e '/--parent-mirror-binary-volatile none/d' \
            -e '/--parent-mirror-chroot-security/d' \
            -e '/--parent-mirror-binary-security/d' \
            -e '/--mirror-chroot-security/d' \
            -e '/--mirror-binary-security/d' \
            -e 's|--debian-installer false|--debian-installer none|' \
            kobos-build.sh
          # Brave ставим отдельным шагом внутри образа (через официальный репозиторий)
          sed -i '/^brave-browser$/d' kobos-build.sh
          cat > brave-hook.sh <<'HOOK'
          #!/bin/sh
          set -e
          export DEBIAN_FRONTEND=noninteractive
          rm -f /etc/apt/sources.list.d/brave*
          apt-get install -y curl ca-certificates
          curl -fsSLo /usr/share/keyrings/brave-browser-archive-keyring.gpg https://brave-browser-apt-release.s3.brave.com/brave-browser-archive-keyring.gpg
          echo "deb [signed-by=/usr/share/keyrings/brave-browser-archive-keyring.gpg arch=amd64] https://brave-browser-apt-release.s3.brave.com/ stable main" > /etc/apt/sources.list.d/brave-browser-release.list
          apt-get update
          apt-get install -y brave-browser
          for alt in x-www-browser gnome-www-browser; do
            update-alternatives --set $alt /usr/bin/brave-browser 2>/dev/null || true
          done
          HOOK
          sed -i '/^lb build 2>&1/i cp ../brave-hook.sh config/hooks/live/0150-brave.hook.chroot && chmod +x config/hooks/live/0150-brave.hook.chroot' kobos-build.sh
          chmod +x kobos-build.sh
          echo "---- проверка lb_config ----"
          sed -n '/^lb config/,/^mkdir -p config/p' kobos-build.sh
          bash -n kobos-build.sh

      - name: Build ISO inside Debian 13 (modern live-build)
        run: |
          docker run --rm --privileged \
            -v "$PWD":/work -w /work \
            -e DEBIAN_FRONTEND=noninteractive \
            debian:trixie \
            bash -c "apt-get update && apt-get install -y ca-certificates && ./kobos-build.sh"

      - name: Upload build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: kobos-build/build.log
          if-no-files-found: ignore

      - name: Prepare ISO for release
        run: |
          ISO=$(sudo find kobos-build -maxdepth 1 -name '*.iso' | head -n1)
          test -n "$ISO" || { echo "ISO не найден"; exit 1; }
          sudo mv "$ISO" kobos-beta1-amd64.hybrid.iso
          sudo chown "$USER" kobos-beta1-amd64.hybrid.iso
          ls -lh kobos-beta1-amd64.hybrid.iso
          sha256sum kobos-beta1-amd64.hybrid.iso > SHA256SUMS

          mkdir release
          size=$(stat -c %s kobos-beta1-amd64.hybrid.iso)
          if [ "$size" -gt 2000000000 ]; then
            # В Releases файл не может быть больше 2 ГБ, поэтому режем на части
            split -b 1900M -d kobos-beta1-amd64.hybrid.iso release/kobos-beta1-amd64.hybrid.iso.part-
            echo "ISO нарезан на части"
          else
            cp kobos-beta1-amd64.hybrid.iso release/
          fi
          cp SHA256SUMS release/
          ls -lh release

      - name: Publish to Releases
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "iso-${{ github.run_number }}" release/* \
            --title "KOBos Beta 1 (build ${{ github.run_number }})" \
            --notes "Если файл разделён на части (.part-00, .part-01, ...), склей: cat kobos-beta1-amd64.hybrid.iso.part-* > kobos-beta1-amd64.hybrid.iso"

      - name: Upload ISO as artifact (запасной вариант)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: kobos-iso
          path: kobos-beta1-amd64.hybrid.iso
          compression-level: 0
          retention-days: 7
