name: KOBos Beta 1 - ISO Build

"on":
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build KOBos ISO
    runs-on: ubuntu-24.04
    timeout-minutes: 360

    steps:
      - name: Checkout KOBos
        uses: actions/checkout@v4

      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf /usr/local/share/powershell
          sudo apt-get clean
          df -h /

      - name: Check build script
        run: |
          test -f kobos-build.sh
          bash -n kobos-build.sh
          chmod +x kobos-build.sh

      - name: Build KOBos ISO
        run: sudo ./kobos-build.sh

      - name: Show ISO
        run: |
          find kobos-build -maxdepth 1 -type f -name '*.iso' -ls
          df -h /

      - name: Upload ISO
        uses: actions/upload-artifact@v4
        with:
          name: KOBos-Beta-1-ISO
          path: |
            kobos-build/*.iso
            kobos-build/build.log
          if-no-files-found: error
          compression-level: 0
          retention-days: 7
